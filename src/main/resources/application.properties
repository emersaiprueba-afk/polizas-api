spring.application.name=polizas-api

# Perfil por defecto: carga datos de ejemplo
spring.profiles.default=local

# Base de datos en memoria H2 (para la prueba). En producción: Oracle.
spring.datasource.url=jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Seguridad mínima (en producción vendría de una variable de entorno o un vault)
seguridad.api-key=${API_KEY:123456}

# Servicio de edición del CORE (aquí apunta al mock de esta misma app)
core.url=${CORE_URL:http://localhost:${server.port:8080}/core-mock/evento}
core.timeout-ms=${CORE_TIMEOUT_MS:3000}

# IPC usado en la renovación (5,10 % de ejemplo; se ajusta por configuración)
negocio.ipc=${IPC:0.0510}
